format:
  revealjs:
    embed-resources: true
    theme: [default, theme.scss]
    css: styles.css
    width: 1600
    height: 900
    margin: 0.07
    center: false
    slide-number: c
    transition: fade
    background-transition: fade
    controls: true
    progress: true
    hash: true
    history: true
    navigation-mode: linear
    slide-level: 2
    footer: 'GCH 2026 · Barcelona · Leveraging 2D and 3D Vision Foundation Models for Archaeological Artifact Classification'
    html-math-method: mathjax
    code-copy: false
    auto-stretch: false
    preview-links: false
lang: en
